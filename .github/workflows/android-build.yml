name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save three@0.128.0

      - name: Prepare offline Three.js
        run: |
          test -f www/index.html
          test "$(wc -c < www/index.html)" -gt 145000
          cp node_modules/three/build/three.min.js www/three.min.js
          cp node_modules/three/examples/js/loaders/GLTFLoader.js www/GLTFLoader.js
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|three.min.js|g' www/index.html
          test -s www/three.min.js
          test -s www/GLTFLoader.js
          grep -q 'src="three.min.js"' www/index.html
          grep -q 'src="GLTFLoader.js"' www/index.html

      - name: Extract Kenney 3D assets
        run: |
          set -e
          mkdir -p www/assets/kenney/cars www/assets/kenney/city www/assets/kenney/roads

          test -f assets/kenney/kenney_car-kit.zip
          test -f assets/kenney/kenney_city-kit-suburban_20.zip
          test -f assets/kenney/kenney_city-kit-roads.zip

          unzip -j -o assets/kenney/kenney_car-kit.zip             "Models/GLB format/sedan.glb"             "Models/GLB format/sedan-sports.glb"             "Models/GLB format/suv.glb"             "Models/GLB format/taxi.glb"             "Models/GLB format/van.glb"             "Models/GLB format/delivery.glb"             "Models/GLB format/police.glb"             "Models/GLB format/ambulance.glb"             -d www/assets/kenney/cars

          unzip -j -o assets/kenney/kenney_city-kit-suburban_20.zip             "Models/GLB format/building-type-a.glb"             "Models/GLB format/building-type-c.glb"             "Models/GLB format/building-type-f.glb"             "Models/GLB format/building-type-h.glb"             "Models/GLB format/building-type-n.glb"             "Models/GLB format/building-type-t.glb"             "Models/GLB format/tree-large.glb"             "Models/GLB format/tree-small.glb"             -d www/assets/kenney/city

          unzip -j -o assets/kenney/kenney_city-kit-roads.zip             "Models/GLB format/light-curved.glb"             "Models/GLB format/traffic-light.glb"             "Models/GLB format/road-sign-stop.glb"             "Models/GLB format/road-bridge.glb"             "Models/GLB format/bridge-pillar-wide.glb"             -d www/assets/kenney/roads

          test -s www/assets/kenney/cars/sedan.glb
          test -s www/assets/kenney/cars/taxi.glb
          test -s www/assets/kenney/roads/traffic-light.glb

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install original icon and splash unchanged
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon.png android/app/src/main/res/drawable/icon.png
          cp assets/splash.png android/app/src/main/res/drawable/splash.png
          cmp -s assets/icon.png android/app/src/main/res/drawable/icon.png
          cmp -s assets/splash.png android/app/src/main/res/drawable/splash.png
          sed -i 's|@mipmap/ic_launcher_round|@drawable/icon|g; s|@mipmap/ic_launcher|@drawable/icon|g' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikoWiko-Aviator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
