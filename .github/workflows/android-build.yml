name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save three@0.128.0

      - name: Prepare complete offline game
        run: |
          test -f www/index.html
          test "$(wc -c < www/index.html)" -gt 120000
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|three.min.js|g' www/index.html
          test -s www/three.min.js
          grep -q 'src="three.min.js"' www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install original icon and splash unchanged
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon.png android/app/src/main/res/drawable/icon.png
          cp assets/splash.png android/app/src/main/res/drawable/splash.png
          cmp -s assets/icon.png android/app/src/main/res/drawable/icon.png
          cmp -s assets/splash.png android/app/src/main/res/drawable/splash.png
          sed -i 's|@mipmap/ic_launcher_round|@drawable/icon|g; s|@mipmap/ic_launcher|@drawable/icon|g' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikoWiko-Aviator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
