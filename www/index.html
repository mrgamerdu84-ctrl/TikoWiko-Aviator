<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />

  <title>TikoWiko Aviator</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#0a2d4f 0,#06111f 42%,#02070d 100%);color:#fff}.card{width:min(92vw,560px);padding:32px;border:1px solid rgba(77,216,255,.25);border-radius:28px;background:rgba(4,18,32,.72);box-shadow:0 0 40px rgba(0,194,255,.12);text-align:center}.logo{width:112px;height:112px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#00d9ff,#1278ff);color:#00131e;font-weight:900;font-size:34px;box-shadow:0 0 32px rgba(0,217,255,.42)}h1{margin:0 0 8px;font-size:34px}p{opacity:.78}.copy{margin-top:28px;font-size:13px;opacity:.55}</style>
</head>
<body>
  <main class="card">
    <div class="logo">TW</div>
    <h1>TikoWiko Aviator</h1>
    <p>Application Android autonome</p>
